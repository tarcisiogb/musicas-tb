<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Músicas do Pai</title>

<!--
==================================================================
  COMO ADICIONAR AS SUAS MÚSICAS
==================================================================
  1. Crie no seu repositório duas pastas:  capas/   e   musicas/
  2. Coloque cada MP3 em  musicas/  e cada capa (jpg ou png) em  capas/
  3. Na lista MUSICAS abaixo (na area de codigo), troque os
     exemplos pelos seus. Cada música é um bloco assim:

        {
          "titulo": "Nome da música",
          "autor": "Nome do seu pai",
          "capa": "capas/nome-da-capa.jpg",
          "audio": "musicas/nome-do-arquivo.mp3",
          "dedicatoria": ""
        }

  - "dedicatoria" pode ficar "" (vazio) por enquanto. Quando você
    escrever algo, aparece um ícone ❦ na capa pra ler a dedicatória.
  - Pra mudar o nome que aparece no topo, procure por
    "Nome do seu Pai" mais abaixo no HTML.
==================================================================
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#15110d;
  --panel:#1d1712;
  --card:#221b14;
  --brass:#c8a15a;
  --brass-soft:#e0c187;
  --glow:rgba(200,161,90,.35);
  --ink:#f1e7da;
  --muted:#b3a48d;
  --hair:rgba(200,161,90,.18);
  --player-h:96px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:
    radial-gradient(120% 90% at 50% -10%, #241b12 0%, var(--bg) 55%) fixed,
    var(--bg);
  color:var(--ink);
  font-family:"Inter",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--player-h) + 24px);
  min-height:100vh;
}

/* ---------- Cabeçalho ---------- */
.site-header{text-align:center;padding:64px 20px 34px}
.eyebrow{
  font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;
  color:var(--brass);font-weight:500;margin:0 0 16px
}
.site-title{
  font-family:"Fraunces",serif;font-weight:500;
  font-size:clamp(2.3rem,7vw,3.6rem);line-height:1.05;
  margin:0;color:var(--ink)
}
.site-sub{
  margin:14px 0 0;color:var(--muted);font-size:1rem;font-style:italic;
  font-family:"Fraunces",serif;font-weight:400
}
.rule{width:54px;height:1px;background:var(--brass);opacity:.55;margin:26px auto 0}

/* ---------- Grade de capas ---------- */
.grid{
  max-width:1120px;margin:8px auto 0;padding:22px 22px 40px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));
  gap:30px 26px
}
.card{
  appearance:none;border:0;background:transparent;padding:0;margin:0;
  text-align:left;cursor:pointer;color:inherit;font:inherit;
  display:flex;flex-direction:column;gap:12px
}
.cover-wrap{
  position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;
  border:1px solid var(--hair);
  box-shadow:0 10px 26px -12px rgba(0,0,0,.75);
  transition:transform .3s ease, box-shadow .3s ease
}
.cover-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card:hover .cover-wrap,.card:focus-visible .cover-wrap{
  transform:translateY(-5px);
  box-shadow:0 20px 40px -14px rgba(0,0,0,.85), 0 0 34px -6px var(--glow)
}
.card:focus-visible{outline:none}
.card:focus-visible .cover-wrap{outline:2px solid var(--brass);outline-offset:3px}

.play-badge{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(0deg,rgba(20,15,10,.55),rgba(20,15,10,.05));
  opacity:0;transition:opacity .3s ease
}
.card:hover .play-badge,.card:focus-visible .play-badge{opacity:1}
.play-badge span{
  width:52px;height:52px;border-radius:50%;
  background:var(--brass);color:#20160c;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 18px rgba(0,0,0,.4)
}
.play-badge svg{width:22px;height:22px;margin-left:2px}

.dedic-btn{
  position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--hair);background:rgba(20,15,10,.6);backdrop-filter:blur(6px);
  color:var(--brass-soft);cursor:pointer;font-size:1rem;line-height:1;
  display:none;align-items:center;justify-content:center;transition:background .2s,transform .2s
}
.dedic-btn.show{display:flex}
.dedic-btn:hover{background:rgba(30,22,15,.9);transform:scale(1.06)}

.card-meta .titulo{
  font-family:"Fraunces",serif;font-weight:500;font-size:1.06rem;
  color:var(--ink);line-height:1.2;display:block
}
.card-meta .autor{
  margin-top:3px;font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--muted);display:block
}

/* capa tocando agora */
.card.is-active .cover-wrap{
  outline:2px solid var(--brass);outline-offset:3px;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.8), 0 0 40px -4px var(--glow)
}
.card.is-active.playing .cover-wrap{animation:breathe 3.4s ease-in-out infinite}
.card.is-active .titulo{color:var(--brass-soft)}
@keyframes breathe{
  0%,100%{box-shadow:0 16px 34px -12px rgba(0,0,0,.8), 0 0 26px -6px var(--glow)}
  50%{box-shadow:0 16px 34px -12px rgba(0,0,0,.8), 0 0 54px 0px var(--glow)}
}

/* ---------- Player fixo ---------- */
.player{
  position:fixed;left:0;right:0;bottom:0;height:var(--player-h);
  background:rgba(24,18,13,.86);backdrop-filter:blur(16px);
  border-top:1px solid var(--hair);
  display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1.4fr);
  align-items:center;gap:20px;padding:0 22px;z-index:40
}
.now{display:flex;align-items:center;gap:14px;min-width:0}
.now-cover{
  width:56px;height:56px;border-radius:8px;object-fit:cover;flex:none;
  border:1px solid var(--hair)
}
.now.playing .now-cover{box-shadow:0 0 22px -2px var(--glow)}
.now-text{min-width:0}
.now-text .t{
  font-family:"Fraunces",serif;font-size:1rem;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.now-text .a{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

.controls{display:flex;align-items:center;gap:8px}
.controls button{
  appearance:none;border:0;background:transparent;color:var(--ink);
  cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;
  transition:color .2s,background .2s
}
.controls .side{width:42px;height:42px}
.controls .side:hover{color:var(--brass-soft)}
.controls .side svg{width:22px;height:22px}
.controls .main{
  width:52px;height:52px;background:var(--brass);color:#20160c
}
.controls .main:hover{background:var(--brass-soft)}
.controls .main svg{width:24px;height:24px}
.controls button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

.seek{display:flex;align-items:center;gap:12px;min-width:0}
.seek .time{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;width:40px}
.seek .time.end{text-align:right}
input[type=range].bar{
  -webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;
  background:linear-gradient(var(--brass),var(--brass)) 0/var(--fill,0%) 100% no-repeat,
             rgba(255,255,255,.12);
  cursor:pointer
}
input[type=range].bar::-webkit-slider-thumb{
  -webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--brass-soft);box-shadow:0 0 8px var(--glow);border:0
}
input[type=range].bar::-moz-range-thumb{
  width:14px;height:14px;border-radius:50%;background:var(--brass-soft);border:0
}
input[type=range].bar:focus-visible{outline:2px solid var(--brass);outline-offset:4px}

/* ---------- Modal de dedicatória ---------- */
.modal{
  position:fixed;inset:0;z-index:60;display:none;
  align-items:center;justify-content:center;padding:22px;
  background:rgba(10,7,4,.72);backdrop-filter:blur(4px)
}
.modal.open{display:flex}
.modal-card{
  background:var(--panel);border:1px solid var(--hair);border-radius:16px;
  max-width:520px;width:100%;padding:30px;position:relative;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.8);max-height:88vh;overflow:auto
}
.modal-card .close{
  position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;
  border:1px solid var(--hair);background:transparent;color:var(--muted);cursor:pointer;font-size:1.1rem
}
.modal-card .close:hover{color:var(--ink)}
.modal-cover{width:96px;height:96px;border-radius:10px;object-fit:cover;border:1px solid var(--hair)}
.modal-card h2{font-family:"Fraunces",serif;font-weight:500;margin:18px 0 2px;font-size:1.5rem}
.modal-card .m-autor{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.modal-text{
  margin-top:20px;font-family:"Fraunces",serif;font-style:italic;font-weight:400;
  font-size:1.12rem;line-height:1.7;color:#e8dcc9;white-space:pre-wrap
}

.empty{text-align:center;color:var(--muted);padding:60px 20px;font-style:italic;font-family:"Fraunces",serif}

/* ---------- Responsivo ---------- */
@media (max-width:640px){
  :root{--player-h:78px}
  .site-header{padding:44px 18px 24px}
  .grid{gap:24px 18px;padding:16px 16px 34px;grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}
  .player{grid-template-columns:auto 1fr;grid-template-areas:"now controls" "seek seek";
    gap:6px 14px;height:auto;padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .now{grid-area:now}.controls{grid-area:controls;justify-self:end}
  .seek{grid-area:seek}
  .now-cover{width:46px;height:46px}
  .controls .side{width:38px;height:38px}.controls .main{width:46px;height:46px}
  .dedic-btn{display:flex}  /* no celular o ícone fica sempre visível quando há dedicatória via .show */
  .dedic-btn:not(.show){display:none}
}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="site-header">
  <p class="eyebrow">Músicas autorais</p>
  <!-- Troque pelo nome do seu pai -->
  <h1 class="site-title">Tarcisio Mario Brito Buzelin</h1>
  <p class="site-sub">um lugar para ouvir e guardar as canções dele</p>
  <div class="rule"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<!-- Player -->
<div class="player" role="region" aria-label="Reprodutor">
  <div class="now" id="now">
    <img class="now-cover" id="nowCover" alt="" src="">
    <div class="now-text">
      <div class="t" id="nowTitle">Escolha uma música</div>
      <div class="a" id="nowAutor"></div>
    </div>
  </div>
  <div class="controls">
    <button class="side" id="prev" aria-label="Anterior">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button class="main" id="playpause" aria-label="Tocar">
      <svg id="ppIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg>
    </button>
    <button class="side" id="next" aria-label="Próxima">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 5h2v14h-2zM4 5l11 7L4 19z"/></svg>
    </button>
  </div>
  <div class="seek">
    <span class="time" id="tCur">0:00</span>
    <input type="range" class="bar" id="bar" value="0" min="0" max="100" step="0.1" aria-label="Progresso da música">
    <span class="time end" id="tEnd">0:00</span>
  </div>
</div>

<!-- Modal dedicatória -->
<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <button class="close" id="mClose" aria-label="Fechar">&times;</button>
    <img class="modal-cover" id="mCover" alt="" src="">
    <h2 id="mTitle"></h2>
    <div class="m-autor" id="mAutor"></div>
    <div class="modal-text" id="mText"></div>
  </div>
</div>

<script src="musicas.js"></script>
<audio id="audio" preload="metadata"></audio>

<script>
/* =============================================================
   SUAS MÚSICAS  — troque os exemplos abaixo pelos seus arquivos
   ============================================================= */
var MUSICAS = (window.MUSICAS || []);

/* ============== daqui pra baixo é o funcionamento ============== */
function placeholder(titulo){
  var L = (titulo && titulo.length) ? titulo.charAt(0).toUpperCase() : '\u266A';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600">'
    + '<defs><radialGradient id="g" cx="38%" cy="32%" r="85%">'
    + '<stop offset="0%" stop-color="#5a3f2a"/><stop offset="100%" stop-color="#241a12"/>'
    + '</radialGradient></defs>'
    + '<rect width="600" height="600" fill="url(#g)"/>'
    + '<circle cx="300" cy="300" r="250" fill="none" stroke="#000" stroke-opacity="0.06" stroke-width="40"/>'
    + '<text x="50%" y="55%" text-anchor="middle" font-family="Georgia, serif" font-size="290" fill="#e0c187" fill-opacity="0.85">'
    + L + '</text></svg>';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
}
function capaDe(m){ return (m.capa && m.capa.length > 0) ? m.capa : placeholder(m.titulo); }
var audio   = document.getElementById('audio');
var grid    = document.getElementById('grid');
var cards   = [];
var current = -1;

var elNow    = document.getElementById('now');
var elCover  = document.getElementById('nowCover');
var elTitle  = document.getElementById('nowTitle');
var elAutor  = document.getElementById('nowAutor');
var elBar    = document.getElementById('bar');
var elCur    = document.getElementById('tCur');
var elEnd    = document.getElementById('tEnd');
var ppIcon   = document.getElementById('ppIcon');

var ICON_PLAY  = '<path d="M7 5v14l12-7z"/>';
var ICON_PAUSE = '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>';

function fmt(s){
  if(isNaN(s) || s < 0){ return '0:00'; }
  var m = Math.floor(s / 60);
  var r = Math.floor(s % 60);
  return m + ':' + (r < 10 ? '0' + r : r);
}

function buildGrid(){
  grid.innerHTML = '';
  cards = [];
  if(!MUSICAS || MUSICAS.length === 0){
    var e = document.createElement('div');
    e.className = 'empty';
    e.textContent = 'Adicione as músicas na lista MUSICAS dentro deste arquivo para começar.';
    grid.appendChild(e);
    return;
  }
  for(var i = 0; i < MUSICAS.length; i++){
    (function(idx){
      var m = MUSICAS[idx];

      var card = document.createElement('button');
      card.className = 'card';
      card.setAttribute('type','button');
      card.setAttribute('aria-label', 'Tocar ' + m.titulo);

      var wrap = document.createElement('div');
      wrap.className = 'cover-wrap';

      var img = document.createElement('img');
      img.alt = 'Capa de ' + m.titulo; img.loading = 'lazy';
      img.onerror = function(){ this.onerror = null; this.src = placeholder(m.titulo); };
      img.src = capaDe(m);
      wrap.appendChild(img);

      var badge = document.createElement('div');
      badge.className = 'play-badge';
      badge.innerHTML = '<span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l12-7z"/></svg></span>';
      wrap.appendChild(badge);

      var ded = document.createElement('button');
      ded.className = 'dedic-btn';
      ded.setAttribute('type','button');
      ded.setAttribute('aria-label','Ler dedicatória');
      ded.innerHTML = '&#10086;';
      if(m.dedicatoria && m.dedicatoria.length > 0){ ded.className = 'dedic-btn show'; }
      ded.addEventListener('click', function(ev){ ev.stopPropagation(); openModal(idx); });
      wrap.appendChild(ded);

      card.appendChild(wrap);

      var meta = document.createElement('div');
      meta.className = 'card-meta';
      var t = document.createElement('span'); t.className = 'titulo'; t.textContent = m.titulo;
      var a = document.createElement('span'); a.className = 'autor';  a.textContent = m.autor;
      meta.appendChild(t); meta.appendChild(a);
      card.appendChild(meta);

      card.addEventListener('click', function(){ selecionar(idx, true); });

      grid.appendChild(card);
      cards.push(card);
    })(i);
  }
}

function marcarAtiva(){
  for(var i = 0; i < cards.length; i++){
    var c = cards[i];
    c.className = 'card';
    if(i === current){
      c.className = 'card is-active' + (isPlaying() ? ' playing' : '');
    }
  }
}

function isPlaying(){ return !audio.paused && !audio.ended && audio.currentTime > 0 || (!audio.paused && audio.readyState > 2); }

function selecionar(idx, tocar){
  if(idx < 0 || idx >= MUSICAS.length){ return; }
  var m = MUSICAS[idx];
  if(idx !== current){
    current = idx;
    audio.src = m.audio;
    elCover.src = capaDe(m);
    elTitle.textContent = m.titulo;
    elAutor.textContent = m.autor;
    elBar.value = 0; elBar.style.setProperty('--fill','0%');
    elCur.textContent = '0:00';
  }
  if(tocar){
    var p = audio.play();
    if(p && p.catch){ p.catch(function(){}); }
  }
  marcarAtiva();
}

function toggle(){
  if(current === -1){ selecionar(0, true); return; }
  if(audio.paused){
    var p = audio.play(); if(p && p.catch){ p.catch(function(){}); }
  } else {
    audio.pause();
  }
}

function proxima(){
  if(MUSICAS.length === 0){ return; }
  var n = (current + 1) % MUSICAS.length;
  selecionar(n, true);
}
function anterior(){
  if(MUSICAS.length === 0){ return; }
  if(audio.currentTime > 3){ audio.currentTime = 0; return; }
  var n = (current - 1 + MUSICAS.length) % MUSICAS.length;
  selecionar(n, true);
}

/* eventos do áudio */
audio.addEventListener('play', function(){
  ppIcon.innerHTML = ICON_PAUSE;
  document.getElementById('playpause').setAttribute('aria-label','Pausar');
  elNow.className = 'now playing';
  marcarAtiva();
});
audio.addEventListener('pause', function(){
  ppIcon.innerHTML = ICON_PLAY;
  document.getElementById('playpause').setAttribute('aria-label','Tocar');
  elNow.className = 'now';
  marcarAtiva();
});
audio.addEventListener('timeupdate', function(){
  if(audio.duration){
    var pct = (audio.currentTime / audio.duration) * 100;
    elBar.value = pct;
    elBar.style.setProperty('--fill', pct + '%');
    elCur.textContent = fmt(audio.currentTime);
  }
});
audio.addEventListener('loadedmetadata', function(){
  elEnd.textContent = fmt(audio.duration);
});
audio.addEventListener('ended', function(){ proxima(); });
audio.addEventListener('error', function(){
  elCur.textContent = '0:00';
});

/* seek */
elBar.addEventListener('input', function(){
  if(audio.duration){
    audio.currentTime = (elBar.value / 100) * audio.duration;
    elBar.style.setProperty('--fill', elBar.value + '%');
  }
});

/* botões */
document.getElementById('playpause').addEventListener('click', toggle);
document.getElementById('next').addEventListener('click', proxima);
document.getElementById('prev').addEventListener('click', anterior);

/* teclado */
document.addEventListener('keydown', function(e){
  var tag = (e.target && e.target.tagName) ? e.target.tagName : '';
  if(tag === 'INPUT' || tag === 'TEXTAREA'){ return; }
  if(e.code === 'Space'){ e.preventDefault(); toggle(); }
  else if(e.code === 'ArrowRight' && audio.duration){ audio.currentTime = Math.min(audio.duration, audio.currentTime + 5); }
  else if(e.code === 'ArrowLeft' && audio.duration){ audio.currentTime = Math.max(0, audio.currentTime - 5); }
});

/* modal */
var modal = document.getElementById('modal');
function openModal(idx){
  var m = MUSICAS[idx];
  document.getElementById('mCover').src = capaDe(m);
  document.getElementById('mTitle').textContent = m.titulo;
  document.getElementById('mAutor').textContent = m.autor;
  document.getElementById('mText').textContent = m.dedicatoria || '';
  modal.className = 'modal open';
  modal.setAttribute('aria-hidden','false');
}
function closeModal(){ modal.className = 'modal'; modal.setAttribute('aria-hidden','true'); }
document.getElementById('mClose').addEventListener('click', closeModal);
modal.addEventListener('click', function(e){ if(e.target === modal){ closeModal(); } });
document.addEventListener('keydown', function(e){ if(e.code === 'Escape'){ closeModal(); } });

buildGrid();
</script>
</body>
</html>
